<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Detective Club Helper</title>
  <meta name="description" content="Helper app for playing Detective Club.">
  <meta property="og:title" content="Detective Club Helper">
  <meta property="og:description" content="Helper app for playing Detective Club.">
  <meta name="theme-color" content="#141417" id="metaThemeColor">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Det. Club">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./ico/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="./ico/icon_x192.png">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('dc_settings_v2');
        if (raw) {
          var s = JSON.parse(raw);
          if (s && s.theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            var meta = document.getElementById('metaThemeColor');
            if (meta) meta.setAttribute('content', '#f5f3ee');
          }
          if (s && s.lang === 'en') {
            document.documentElement.setAttribute('lang', 'en');
          }
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <button type="button" id="homeBtn" class="brand-btn" aria-label="Detective Club">
          <span class="brand-title">Detective Club</span>
        </button>

        <div class="topbar-actions">
          <button type="button" id="scoresBtn" class="icon-btn hidden" aria-label="Scores" title="Scores">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 21h8"></path>
              <path d="M12 17v4"></path>
              <path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"></path>
              <path d="M17 6h2a2 2 0 0 1 0 4h-2"></path>
              <path d="M7 6H5a2 2 0 0 0 0 4h2"></path>
            </svg>
          </button>

          <button type="button" id="settingsBtn" class="icon-btn" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main id="app" class="app-main" aria-live="polite"></main>

    <div id="offlineBanner" class="offline-banner hidden" role="status"></div>
  </div>

  <!-- Scoreboard Modal -->
  <div id="scoresModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="scoresModalTitle">
    <div class="modal-sheet">
      <div class="modal-handle" aria-hidden="true"></div>
      <div class="modal-header">
        <h2 id="scoresModalTitle" class="modal-title"></h2>
        <button type="button" class="icon-btn modal-close" data-close-modal="scoresModal" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>
      <div id="scoresModalBody" class="modal-body"></div>
      <div id="scoresModalFooter" class="modal-footer"></div>
    </div>
  </div>

  <!-- Settings & Rules Modal -->
  <div id="settingsModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
    <div class="modal-sheet modal-sheet-tall">
      <div class="modal-handle" aria-hidden="true"></div>
      <div class="modal-header">
        <h2 id="settingsModalTitle" class="modal-title"></h2>
        <button type="button" class="icon-btn modal-close" data-close-modal="settingsModal" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>
      <div id="settingsTabs" class="modal-tabs"></div>
      <div id="settingsModalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- Confirm Modal -->
  <div id="confirmModal" class="modal-backdrop hidden" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal-dialog">
      <h3 id="confirmTitle" class="dialog-title"></h3>
      <p id="confirmMessage" class="dialog-message"></p>
      <div class="dialog-actions">
        <button type="button" id="confirmCancelBtn" class="btn btn-secondary"></button>
        <button type="button" id="confirmOkBtn" class="btn btn-primary"></button>
      </div>
    </div>
  </div>

  <!-- iOS Install Guide Modal -->
  <div id="iosInstallModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="iosInstallTitle">
    <div class="modal-dialog">
      <h3 id="iosInstallTitle" class="dialog-title"></h3>
      <div id="iosInstallBody" class="dialog-message"></div>
      <div class="dialog-actions">
        <button type="button" id="iosInstallCloseBtn" class="btn btn-primary full-width" data-close-modal="iosInstallModal"></button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="./scripts/script.js"></script>
</body>

</html>
